name: Build Windows Installer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install All Sub-App Dependencies
        run: |
          npm install --legacy-peer-deps
          cd frontend/captain
          npm install --legacy-peer-deps
          cd ../kitchen
          npm install --legacy-peer-deps
          cd ../..

      - name: Build All Apps
        run: npm run build

      - name: Setup Git Tag for Electron Builder
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a v1.6.6 -m "v1.6.6" || true

      - name: Package Windows App (.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows Setup .exe to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Installer
          path: |
            release/*.exe
            release/*.blockmap
