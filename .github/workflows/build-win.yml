name: Build Windows Installer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Captain Dependencies
        working-directory: frontend/captain
        run: npm install --legacy-peer-deps

      - name: Install Kitchen Dependencies
        working-directory: frontend/kitchen
        run: npm install --legacy-peer-deps

      - name: Build Root App
        run: npx vite build

      - name: Build Captain App
        working-directory: frontend/captain
        run: npm run build

      - name: Build Kitchen App
        working-directory: frontend/kitchen
        run: npm run build

      - name: Package Windows App
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Installer
          path: |
            release/*.exe
