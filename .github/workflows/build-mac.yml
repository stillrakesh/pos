name: Build macOS Installer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download macOS Node Binary
        run: |
          curl -LO https://nodejs.org/dist/v22.16.0/node-v22.16.0-darwin-x64.tar.gz
          tar -xzf node-v22.16.0-darwin-x64.tar.gz
          cp node-v22.16.0-darwin-x64/bin/node ./bundled-node-mac
          chmod +x ./bundled-node-mac

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Captain Dependencies
        working-directory: frontend/captain
        run: npm install --legacy-peer-deps

      - name: Install Kitchen Dependencies
        working-directory: frontend/kitchen
        run: npm install --legacy-peer-deps

      - name: Build All Apps
        run: |
          echo "=== Root Vite Build ===" > build-output.log 2>&1
          npx vite build >> build-output.log 2>&1 || echo "ROOT_BUILD_FAILED" >> build-output.log
          echo "=== Captain Build ===" >> build-output.log 2>&1
          cd frontend/captain && npm run build >> ../../build-output.log 2>&1 || echo "CAPTAIN_BUILD_FAILED" >> ../../build-output.log
          cd ../kitchen && npm run build >> ../../build-output.log 2>&1 || echo "KITCHEN_BUILD_FAILED" >> ../../build-output.log
          cd ../..
          cat build-output.log
          if grep -q "_FAILED" build-output.log; then exit 1; fi

      - name: Package Mac App
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 -c.mac.identity=null --publish never

      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac-Build-Logs
          path: build-output.log

      - name: Upload Mac Installer
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Mac-Installer
          path: |
            release/*.dmg
            release/*.zip
