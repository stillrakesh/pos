name: Build macOS Installer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download macOS Node Binary
        run: |
          curl -LO https://nodejs.org/dist/v20.12.2/node-v20.12.2-darwin-x64.tar.gz
          tar -xzf node-v20.12.2-darwin-x64.tar.gz
          cp node-v20.12.2-darwin-x64/bin/node ./bundled-node-mac
          chmod +x ./bundled-node-mac

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web & Sub-Apps
        run: npm run build

      - name: Package Mac App (.dmg)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 -c.mac.identity=null --publish never

      - name: Upload DMG to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac-Installer
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
