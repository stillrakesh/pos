name: Build macOS Installer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download macOS Node Binary
        run: |
          curl -LO https://nodejs.org/dist/v20.12.2/node-v20.12.2-darwin-x64.tar.gz
          tar -xzf node-v20.12.2-darwin-x64.tar.gz
          cp node-v20.12.2-darwin-x64/bin/node ./bundled-node-mac
          chmod +x ./bundled-node-mac

      - name: Install All Sub-App Dependencies
        run: |
          npm install --legacy-peer-deps
          cd frontend/captain && npm install --legacy-peer-deps && cd ../..
          cd frontend/kitchen && npm install --legacy-peer-deps && cd ../..

      - name: Build All Apps
        run: npm run build

      - name: Setup Git Tag for Electron Builder
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a v1.6.6 -m "v1.6.6" || true

      - name: Package Mac App (.dmg)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 -c.mac.identity=null --publish never

      - name: Upload DMG to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac-Installer
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
